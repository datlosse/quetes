// XP curve
function xpForNextLevel(n) {
  return n * 400; // niveau N coûte N×400 XP
}
function computeLevel(totalXP) {
  var level = 1,
    used = 0;
  while (true) {
    var need = xpForNextLevel(level);
    if (used + need > totalXP) break;
    used += need;
    level++;
  }
  return {
    level: level,
    xpIn: totalXP - used,
    xpNeeded: xpForNextLevel(level)
  };
}

// Points d'avancée : chaque quête accomplie fait avancer tous les arcs ouverts
var DOFUS_POINTS = { daily: 1, weekly: 2, monthly: 4, quarterly: 8, legendary: 15 };
function questPoints(h) {
  if (!h || h.level === "dofus") return 0;
  var p = DOFUS_POINTS[h.level] || 0;
  if (p && (h.isZC || h.quest && h.quest.isZC)) p += 1;
  return p;
}
// État d'un arc : earned, locked, active, blocked, waiting, ready ou done
function dofusArcState(id, ctx) {
  var d = DOFUS[id];
  var total = d.quests.length;
  var doneCount = d.quests.filter(function (q) { return ctx.completed.indexOf(id + "_" + q.pct) >= 0; }).length;
  var base = { done: doneCount, total: total, gap: d.gap || 0, points: 0 };
  if (ctx.earned.indexOf(id) >= 0) return Object.assign(base, { status: "earned" });
  var op = d.open || { level: 1, after: [] };
  var missing = (op.after || []).filter(function (a) { return ctx.earned.indexOf(a) < 0; });
  if (ctx.level < op.level || missing.length) return Object.assign(base, { status: "locked", openLevel: op.level, after: missing });
  var cur = ctx.active.find(function (a) { return a.dofusId === id && !a.flovar; });
  if (cur) return Object.assign(base, { status: "active", current: cur });
  var next = d.quests.find(function (q) { return ctx.completed.indexOf(id + "_" + q.pct) < 0; });
  if (!next) return Object.assign(base, { status: "done" });
  if (next.req === "tachete" && ctx.earned.indexOf("tachete") < 0) return Object.assign(base, { status: "blocked", next: next, need: "le Dofus Tacheté" });
  if (next.req === "six" && !PRIMORDIAL_DOFUS.every(function (p) { return ctx.earned.indexOf(p) >= 0; })) return Object.assign(base, { status: "blocked", next: next, need: "les six Dofus primordiaux" });
  if (next.req === "cauchemar" && ctx.earned.indexOf("cauchemar") < 0) return Object.assign(base, { status: "blocked", next: next, need: "le Dofus Cauchemar" });
  if (doneCount === 0) return Object.assign(base, { status: "ready", next: next });
  var lastMs = 0;
  ctx.history.forEach(function (h) {
    if (h.level === "dofus" && h.dofusId === id && !h.flovar && (h.completedMs || 0) > lastMs) lastMs = h.completedMs || 0;
  });
  var pts = 0;
  ctx.history.forEach(function (h) { if ((h.completedMs || 0) > lastMs) pts += questPoints(h); });
  base.points = pts;
  if (pts >= base.gap || ctx.skip && ctx.skip[id]) return Object.assign(base, { status: "ready", next: next });
  return Object.assign(base, { status: "waiting", next: next });
}
// Saison du Flovar (équinoxes et solstices)
function flovarSeasonNow(dt) {
  var md = (dt.getMonth() + 1) * 100 + dt.getDate(), y = dt.getFullYear();
  if (md >= 320 && md < 621) return { key: y + "-printemps", season: "printemps", year: y };
  if (md >= 621 && md < 922) return { key: y + "-ete", season: "ete", year: y };
  if (md >= 922 && md < 1221) return { key: y + "-automne", season: "automne", year: y };
  var hy = md >= 1221 ? y : y - 1;
  return { key: hy + "-hiver", season: "hiver", year: hy };
}
